<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scopus Abstract Visualization</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 450px;
        }

        .summary {
            margin-top: 25px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Number of Articles with Abstract</h1>

    <div class="chart-container">
        <canvas id="abstractChart"></canvas>
    </div>

    <div class="summary">
        <p><strong>Total Articles:</strong> 200</p>
        <p><strong>Articles with Abstract:</strong> 200</p>
        <p><strong>Articles without Abstract:</strong> 0</p>
    </div>

</div>

<script>

    // ข้อมูลจาก Scopus
    const labels = [
        "Has Abstract",
        "No Abstract"
    ];

    const data = [
        200,
        0
    ];

    // สร้างกราฟ
    const ctx = document.getElementById('abstractChart');

    new Chart(ctx, {
        type: 'bar',

        data: {
            labels: labels,

            datasets: [{
                label: 'Number of Articles',
                data: data,
                borderWidth: 1
            }]
        },

        options: {
            responsive: true,

            plugins: {
                legend: {
                    display: true
                },

                tooltip: {
                    enabled: true
                }
            },

            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Abstract Availability'
                    }
                },

                y: {
                    beginAtZero: true,

                    title: {
                        display: true,
                        text: 'Number of Articles'
                    },

                    ticks: {
                        stepSize: 25
                    }
                }
            }
        }
    });

</script>

</body>
</html>
