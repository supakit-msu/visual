<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Scopus Visualization</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h2>Scopus Publications by Year</h2>
<canvas id="chart"></canvas>
<script>
const labels=['2025'];
const data=[200];
new Chart(document.getElementById('chart'), {
 type:'bar',
 data:{
  labels:labels,
  datasets:[{label:'Publications',data:data}]
 }
});
</script>
</body>
</html>
